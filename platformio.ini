[platformio]
default_envs = nano_old

[env]
platform = atmelavr@5.1.0
framework = arduino
lib_deps = arduino-libraries/Servo@1.2.2
monitor_speed = 115200
build_flags = -Wall -Wextra

; Common on older Nano clones. Try nano_new if upload fails.
[env:nano_old]
board = nanoatmega328

[env:nano_new]
board = nanoatmega328new
